name: VAB Dashboard Daten aktualisieren

on:
  schedule:
    - cron: "15 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: VAB Fahrplandokumente aktualisieren
        run: |
          python tools/update_fahrplan_pdfs.py

      - name: Datenstand für Dashboard schreiben
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          target = Path("dashboard/data-status.json")

          data = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "automatic_update": True,
              "schedule": "daily",
              "sources": {
                  "fahrplan_pdf_zuordnung": "automatic",
                  "fahrplan_index": "existing_project_data",
                  "haltestellen_suchindex": "existing_project_data"
              }
          }

          target.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fahrplan_pdf_zuordnung.json dashboard/data-status.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Dashboard-Daten automatisch aktualisieren"
            git push
          fi
