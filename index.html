<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interaktives VAB-Liniennetz</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="css/style.css?v=20261015-drag-small30"
  >
</head>

<body>
  <header class="kopfbereich">
    <div>
      <h1>Interaktives VAB-Liniennetz</h1>
      <p>Geroutete Linienverläufe und Fahrplaninformationen &middot; Stand: <span id="tagesdatum"></span></p>
    </div>


    <!-- BEGIN VAB-SUCHE -->
    <div class="vab-suche">
      <form
        id="vab-suche-formular"
        class="vab-suche-formular"
        role="search"
        autocomplete="off"
      >
        <label
          for="vab-suche-eingabe"
          class="vab-suche-label"
        >
          Haltestelle oder Ort
        </label>

        <div class="vab-suche-eingabezeile">
          <input
            id="vab-suche-eingabe"
            class="vab-suche-eingabe"
            type="search"
            placeholder="z. B. Sulzbach oder Hauptbahnhof"
            aria-label="Haltestelle oder Ort suchen"
            aria-controls="vab-suche-vorschlaege"
            aria-expanded="false"
            disabled
          >

          <button
            class="vab-suche-button"
            type="submit"
            aria-label="Suche starten"
            disabled
          >
            Suchen
          </button>
        </div>

        <div
          id="vab-suche-vorschlaege"
          class="vab-suche-vorschlaege"
          role="listbox"
          hidden
        ></div>
      </form>
    </div>
    <!-- END VAB-SUCHE -->


  </header>

  <main class="kartenlayout">
    <aside
      id="info-panel"
      class="info-panel"
      aria-live="polite"
      aria-hidden="true"
    >
      <button
        id="info-panel-schliessen"
        class="info-panel-schliessen"
        type="button"
        aria-label="Information schließen"
      >
        ×
      </button>

      <div id="info-panel-inhalt">
        <div class="info-panel-leer">
          Wählen Sie einen gemeinsamen Linienabschnitt aus.
        </div>
      </div>
    </aside>

    <div
      id="karte"
      role="application"
      aria-label="Interaktive Karte des VAB-Liniennetzes"
    ></div>
    <div id="vab-gebiet-titel" class="vab-gebiet-titel-ziehbar" role="group" aria-label="VAB-Gebietsüberschrift verschieben" tabindex="0" title="Mit der Maus ziehen oder mit Pfeiltasten verschieben">
      <strong>Das Gebiet der VAB</strong>
      <span>Verkehrs- und Tarifgemeinschaft am Bayerischen Untermain</span>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script src="js/app.js?v=20261015-drag-v1"></script>
  <script>
    // Verschiebbare Kartenbeschriftung; Position wird nur in diesem Browser gespeichert.
    (() => {
      const mapArea = document.querySelector('.kartenlayout');
      const label = document.getElementById('vab-gebiet-titel');
      if (!mapArea || !label) return;
      const storageKey = 'vab-gebiet-titel-position-v1';
      let position = { x: 0.5, y: 0.02 };
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (Number.isFinite(saved?.x) && Number.isFinite(saved?.y)) {
          position = saved;
        }
      } catch (_) {}
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      function place() {
        const width = mapArea.clientWidth;
        const height = mapArea.clientHeight;
        if (!width || !height) return;
        const half = label.offsetWidth / 2;
        const x = clamp(position.x * width, half + 4, Math.max(half + 4, width - half - 4));
        const y = clamp(position.y * height, 4, Math.max(4, height - label.offsetHeight - 4));
        label.style.left = x + 'px';
        label.style.top = y + 'px';
        position = { x: x / width, y: y / height };
      }
      function save() {
        try { localStorage.setItem(storageKey, JSON.stringify(position)); } catch (_) {}
      }
      let drag = null;
      label.addEventListener('pointerdown', event => {
        if (event.button !== 0 && event.pointerType === 'mouse') return;
        const rect = label.getBoundingClientRect();
        drag = { id: event.pointerId, dx: event.clientX - (rect.left + rect.width / 2), dy: event.clientY - rect.top };
        label.setPointerCapture(event.pointerId);
        label.classList.add('wird-gezogen');
        event.preventDefault();
        event.stopPropagation();
      });
      label.addEventListener('pointermove', event => {
        if (!drag || event.pointerId !== drag.id) return;
        const rect = mapArea.getBoundingClientRect();
        position = {
          x: (event.clientX - rect.left - drag.dx) / rect.width,
          y: (event.clientY - rect.top - drag.dy) / rect.height
        };
        place();
        event.preventDefault();
      });
      function finish(event) {
        if (!drag || event.pointerId !== drag.id) return;
        drag = null;
        label.classList.remove('wird-gezogen');
        save();
      }
      label.addEventListener('pointerup', finish);
      label.addEventListener('pointercancel', finish);
      label.addEventListener('keydown', event => {
        const steps = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, -10], ArrowDown: [0, 10] };
        const step = steps[event.key];
        if (!step) return;
        event.preventDefault();
        position.x += step[0] / mapArea.clientWidth;
        position.y += step[1] / mapArea.clientHeight;
        place();
        save();
      });
      window.addEventListener('resize', place);
      requestAnimationFrame(place);
    })();
  </script>

  <script>
    document.getElementById("tagesdatum").textContent =
      new Intl.DateTimeFormat(
        "de-DE",
        { timeZone: "Europe/Berlin" }
      ).format(new Date());
  </script>
</body>
</html>
